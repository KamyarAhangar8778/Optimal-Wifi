; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

build_flags =
    -Iinclude
    -Iinclude/Core
    -Iinclude/Core/Async
    -Iinclude/Core/Async/Future
    -Iinclude/Core/Error
    -Iinclude/Events
    -Iinclude/Events/Base
    -Iinclude/Events/Impl
    -Iinclude/Optimization
    -Iinclude/Optimization/FastFunction
    -Iinclude/Optimization/SmallVector
    -Iinclude/Optimization/StaticArray
    -Iinclude/Optimization/StaticHashMap
    -Iinclude/Timer
    -Iinclude/Timer/Optimization
    -Iinclude/Utilities
    -Isrc/tests
    -Ilib/WiFi/src

; Unit tests live in test/, do NOT compile src/main.cpp together with them.
; Each test folder is a separate embedded test target (Unity based).
test_build_src = no

; Our optimized WiFi library now lives in lib/WiFi_Optimized
; (PlatformIO gives lib/ higher priority than the framework's built-in WiFi).
lib_deps =
    WiFi

; Serial upload & monitor port. Change COM4 to your ESP32's port if different.
monitor_speed = 115200
